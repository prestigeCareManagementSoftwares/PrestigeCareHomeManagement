{% extends "core/base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h2>{{ edit_mode|yesno:"Edit User,Create User" }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-row">
            <!-- First Name -->
            <div class="form-group col-md-6">
                <label>First Name {% if not edit_mode %}*{% endif %}</label>
                <input type="text" class="form-control" name="first_name" value="{{ user.first_name }}" {% if not edit_mode %}required{% endif %}>
            </div>

            <!-- Last Name -->
            <div class="form-group col-md-6">
                <label>Last Name {% if not edit_mode %}*{% endif %}</label>
                <input type="text" class="form-control" name="last_name" value="{{ user.last_name }}" {% if not edit_mode %}required{% endif %}>
            </div>
        </div>

        <div class="form-row">
            <!-- Email -->
            <div class="form-group col-md-6">
                <label>Email {% if not edit_mode %}*{% endif %}</label>
                <input type="email" class="form-control" name="email" value="{{ user.email }}" {% if not edit_mode %}required{% endif %}>
            </div>

            <!-- Username -->
            <div class="form-group col-md-6">
                <label>Username {% if not edit_mode %}*{% endif %}</label>
                <input type="text" class="form-control" name="username" value="{{ user.username }}" {% if not edit_mode %}required{% endif %}>
            </div>
        </div>

        <div class="form-row">
            <!-- Password -->
            <div class="form-group col-md-6">
                <label>Password {% if not edit_mode %}*{% endif %}</label>
                <div class="input-group">
                    <input type="password" class="form-control" name="password1" id="password1" {% if not edit_mode %}required{% endif %}>
                    <div class="input-group-append">
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password1">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group col-md-6">
                <label>Confirm Password {% if not edit_mode %}*{% endif %}</label>
                <div class="input-group">
                    <input type="password" class="form-control" name="password2" id="password2" {% if not edit_mode %}required{% endif %}>
                    <div class="input-group-append">
                        <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password2">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Profile Picture -->
        <div class="form-group">
            <label>Profile Picture</label>
            <input type="file" class="form-control-file" name="profile_pic">
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">{{ edit_mode|yesno:"Update,Create" }}</button>
    </form>
</div>

<script>
    // Toggle password visibility
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', () => {
            const target = document.getElementById(button.dataset.target);
            if (target.type === "password") {
                target.type = "text";
            } else {
                target.type = "password";
            }
        });
    });
</script>
{% endblock %}
