{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
const data = {
  first_name: "{{ first_name }}",
  last_name: "{{ last_name }}",
  role: "{{ role|default:'Support Worker' }}",
  photo: "{{ photo }}",
  qr_code_value: "{{ qr_code_value }}",
};

function generateCardNumber() {
  return `PLC${Math.floor(100000 + Math.random() * 900000)}`;
}

function getInitials(f, l) {
  return `${(f||"X")[0]}${(l||"X")[0]}`.toUpperCase();
}

function safeText(t, fb="") {
  const v = (t ?? "").trim();
  return v || fb;
}

function loadPreview() {
  const cardNo = generateCardNumber();
  const fullName = `${safeText(data.first_name,"Employee")} ${safeText(data.last_name,"")}`.trim();

  document.getElementById("previewContainer").innerHTML = `
  <!-- FRONT -->
  <div class="id-card mb-3" id="frontCard">
    ${svgBands()}
    <div class="card-content">
      <div class="photo-slot">
        <div class="photo-inner">
          <img id="empPhoto"/>
          <div class="initials" id="empInitials" hidden></div>
        </div>
      </div>

      <div class="text-block">
        <div class="emp-name">${fullName}</div>
        <div class="emp-role">${safeText(data.role)}</div>
        <div class="emp-cardno">Card no. <span>${cardNo}</span></div>
      </div>
    </div>
  </div>

  <!-- BACK -->
  <div class="id-card" id="backCard">
    ${svgBands()}
    <div class="card-content back-layout">
      <div class="logo-wrap">
        <img src="{% static 'core/images/company-logo.jpeg' %}">
      </div>

      <div class="qr-back"><div id="qrBoxBack"></div></div>

      <div class="footer">
        <div class="footer-row">
          🌐 www.prestigesupportedliving.com
          <span class="spacer"></span>
          ✉ info@prestigesupportedliving.com
        </div>
        <div class="footer-row small">
          📍 Office 407B, 4th floor, Jhumat House, 160 London Road, Barking, London, IG11 8BB,
          02082141283, 02082141284
        </div>
      </div>
    </div>
  </div>
  `;

  const img = document.getElementById("empPhoto");
  const initials = document.getElementById("empInitials");

  if (data.photo) {
    img.src = data.photo;
    img.style.display = "block";
  } else {
    img.style.display = "none";
    initials.textContent = getInitials(data.first_name, data.last_name);
    initials.hidden = false;
  }

  new QRCode(document.getElementById("qrBoxBack"), {
    text: data.qr_code_value || cardNo,
    width: 80,
    height: 80
  });
}

function svgBands() {
  return `
  <svg class="card-bg" viewBox="0 0 500 300" preserveAspectRatio="none">
    <polygon points="0,0 500,0 500,52 250,40 0,52" fill="#6b1f6b"/>
    <polyline points="0,52 250,40 500,52" stroke="#fff" stroke-width="6" fill="none"/>
    <polyline points="0,64 250,52 500,64" stroke="#fff" stroke-width="6" fill="none"/>
    <polygon points="0,300 500,300 500,248 250,260 0,248" fill="#6b1f6b"/>
    <polyline points="0,248 250,260 500,248" stroke="#fff" stroke-width="6" fill="none"/>
    <polyline points="0,236 250,248 500,236" stroke="#fff" stroke-width="6" fill="none"/>
  </svg>`;
}

document.addEventListener("DOMContentLoaded", loadPreview);
</script>
{% endblock %}
