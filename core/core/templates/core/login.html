{% extends "core/base_login.html" %}
{% load static %}

{% block content %}
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&display=swap');

  body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #A3BFFA, #C084FC);
    overflow: hidden;
    position: relative;
  }

  /* Waves background */
  .wave-stage {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .wave {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 160%;
    height: 50vh;
    min-height: 200px;
  }
  .w1 { top: 40%; animation: drift1 16s ease-in-out infinite alternate; opacity: 0.6; }
  .w2 { top: 50%; animation: drift2 22s ease-in-out infinite alternate; opacity: 0.45; }
  .w3 { top: 60%; animation: drift3 28s ease-in-out infinite alternate; opacity: 0.30; }

  @keyframes drift1 { from { transform: translate(-55%,0); } to { transform: translate(-45%,0); } }
  @keyframes drift2 { from { transform: translate(-60%,0); } to { transform: translate(-40%,0); } }
  @keyframes drift3 { from { transform: translate(-65%,0); } to { transform: translate(-35%,0); } }

  /* Layout split */
  .login-wrapper {
    position: relative;
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 90%;
    max-width: 1200px;
    gap: 2rem;
  }

  .left-panel {
    flex: 1;
    color: #fff;
    text-align: center;
  }
  .left-panel img {
    width: 120px;
    margin-bottom: 1rem;
  }
  .left-panel h1 {
    font-size: 1.8rem;
    line-height: 1.4;
    font-weight: 600;
  }

  .right-panel {
    flex: 1;
    display: flex;
    justify-content: center;
  }

  /* Glassmorphic form */
  section.login-form {
    width: 100%;
    max-width: 400px;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.5);
    border-radius: 20px;
    backdrop-filter: blur(25px);
    padding: 2.5rem 2rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
    color: #ffffff;
  }

  .inputbox {
    position: relative;
    margin-bottom: 1.5rem;
  }

  .inputbox input {
    width: 100%;
    padding: 0.75rem 2.5rem 0.75rem 0.75rem;
    background: transparent;
    border: none;
    border-bottom: 2px solid #ffffff;
    color: #ffffff;
    font-size: 1rem;
    outline: none;
  }

  .inputbox label {
    position: absolute;
    left: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    color: rgba(255,255,255,0.9);
    font-size: 1rem;
    pointer-events: none;
    transition: all 0.4s ease;
  }

  /* Float up when focused, filled, or autofilled */
  .inputbox input:focus ~ label,
  .inputbox input:not(:placeholder-shown) ~ label,
  .inputbox input:-webkit-autofill ~ label {
    top: -10px;
    font-size: 0.85rem;
    color: #ffffff;
  }

  .inputbox .icon {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.2rem;
    color: #ffffff;
  }

  .remember-forget {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.5rem;
    font-size: 0.9rem;
    color: #ffffff;
  }

  .btn-login {
    width: 100%;
    padding: 0.8rem;
    border: none;
    border-radius: 30px;
    background: #ffffff;
    color: #4f46e5;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .btn-login:hover {
    background: rgba(255,255,255,0.8);
  }
</style>

<!-- Waves background -->
<div class="wave-stage">
  <!-- keep your SVG wave elements here like before -->
</div>

<div class="login-wrapper">
  <!-- Left side: name + logo -->
  <div class="left-panel">
    <img src="{% static 'core/images/carehome_logo.png' %}" alt="Carehome Logo">
    <h1>Prestige Supported Living Care Limited</h1>
  </div>

  <!-- Right side: form -->
  <div class="right-panel">
    <section class="login-form">
      <form method="POST">
        {% csrf_token %}

        <div class="inputbox">
          <input type="text" name="username" placeholder=" " required />
          <label>Username</label>
          <span class="icon">👤</span>
        </div>

        <div class="inputbox">
          <input type="password" name="password" placeholder=" " required />
          <label>Password</label>
          <span class="icon">🔒</span>
        </div>

        <div class="remember-forget">
          <label><input type="checkbox" name="remember_me" /> Remember Me</label>
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">Log In</button>
      </form>
    </section>
  </div>
</div>
{% endblock %}
