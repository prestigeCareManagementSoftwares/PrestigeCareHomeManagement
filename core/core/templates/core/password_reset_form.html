{% extends "core/base_login.html" %}
{% block content %}
<h2>Forgot Password</h2>
<p>Enter your work email and personal email to reset your password.</p>

<form method="post">
  {% csrf_token %}
  <div class="form-group">
    {{ form.email.label_tag }}
    {{ form.email }}
  </div>
  <div class="form-group">
    {{ form.contact_email.label_tag }}
    {{ form.contact_email }}
  </div>
  <button type="submit" class="btn btn-primary">Send Reset Link</button>
</form>
{% endblock %}
